mixed-port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxies: []
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 手动选择
  - 🇹🇼 台湾
  - 🇺🇸 美国
  - DIRECT
- name: ♻️ 自动选择
  type: url-test
  url: https://gemini.google.com/
  expected-status: 200-399
  interval: 180
  tolerance: 50
  lazy: false
  proxies:
  - REJECT
- name: 🌐 手动选择
  type: select
  proxies:
  - DIRECT
- name: 🇹🇼 台湾
  type: select
  proxies:
  - DIRECT
- name: 🇺🇸 美国
  type: select
  proxies:
  - DIRECT
rules:
- GEOSITE,CN,DIRECT
- GEOIP,CN,DIRECT
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- DOMAIN-SUFFIX,cn,DIRECT
- DOMAIN-SUFFIX,com.cn,DIRECT
- DOMAIN-SUFFIX,org.cn,DIRECT
- DOMAIN-SUFFIX,net.cn,DIRECT
- DOMAIN-SUFFIX,gov.cn,DIRECT
- DOMAIN-SUFFIX,qq.com,DIRECT
- DOMAIN-SUFFIX,baidu.com,DIRECT
- DOMAIN-SUFFIX,taobao.com,DIRECT
- DOMAIN-SUFFIX,tmall.com,DIRECT
- DOMAIN-SUFFIX,jd.com,DIRECT
- DOMAIN-SUFFIX,bilibili.com,DIRECT
- DOMAIN-SUFFIX,wechat.com,DIRECT
- DOMAIN-SUFFIX,weixin.qq.com,DIRECT
- DOMAIN-SUFFIX,163.com,DIRECT
- DOMAIN-SUFFIX,alibaba.com,DIRECT
- DOMAIN-SUFFIX,gemini.google.com,♻️ 自动选择
- DOMAIN-SUFFIX,googleapis.com,♻️ 自动选择
- DOMAIN-SUFFIX,generativelanguage.googleapis.com,♻️ 自动选择
- DOMAIN-SUFFIX,google.com,♻️ 自动选择
- MATCH,🚀 节点选择
