# fine-clash-unified-v1 | Bitz=remote-provider | Fine=validated-pool | Ozon/Amazon->Bitz | CN->DIRECT | MATCH->Fine
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: false
tcp-concurrent: true
profile:
  store-selected: true
proxy-providers:
  BitzPool:
    type: http
    url: 'https://cont.bbkcdpub.com/api/v1/client/BitzNet.conf?token=23a7ad64b83f7b867eb75da3738184c6'
    interval: 21600
proxies:
- name: 未知 VLESS-145 | free-nodes
  type: vless
  server: fbsv6.guardora.pro
  port: 443
  uuid: bc5ec86c-3e65-4272-994c-59a924c72a68
  tls: true
  servername: fbsv6.guardora.pro
  network: ws
  client-fingerprint: chrome
  ws-opts:
    path: /ws
    headers:
      Host: fbsv6.guardora.pro
proxy-groups:
- name: GLOBAL
  type: select
  proxies:
  - Fine
  - Bitz
  - DIRECT
- name: Bitz
  type: url-test
  use:
  - BitzPool
  url: https://www.ozon.ru/
  interval: 900
  timeout: 8000
  tolerance: 100
  lazy: false
- name: Fine
  type: url-test
  proxies:
  - 未知 VLESS-145 | free-nodes
  url: https://www.gstatic.com/generate_204
  interval: 900
  timeout: 8000
  tolerance: 100
  lazy: false
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: redir-host
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 1.1.1.1
  fallback:
  - https://1.1.1.1/dns-query
  - tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
rules:
- DOMAIN-SUFFIX,lan,DIRECT
- DOMAIN-SUFFIX,local,DIRECT
- DOMAIN-SUFFIX,localhost,DIRECT
- DOMAIN-SUFFIX,cn,DIRECT
- DOMAIN-SUFFIX,com.cn,DIRECT
- DOMAIN-SUFFIX,net.cn,DIRECT
- DOMAIN-SUFFIX,gov.cn,DIRECT
- DOMAIN-SUFFIX,edu.cn,DIRECT
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- DOMAIN-SUFFIX,weixin.qq.com,DIRECT
- DOMAIN-SUFFIX,wx.qq.com,DIRECT
- DOMAIN-SUFFIX,wechat.com,DIRECT
- DOMAIN-SUFFIX,qpic.cn,DIRECT
- DOMAIN-SUFFIX,qlogo.cn,DIRECT
- DOMAIN-SUFFIX,gtimg.cn,DIRECT
- DOMAIN-SUFFIX,gtimg.com,DIRECT
- DOMAIN-SUFFIX,qq.com,DIRECT
- DOMAIN-SUFFIX,tenpay.com,DIRECT
- DOMAIN-SUFFIX,wechatpay.cn,DIRECT
- DOMAIN-SUFFIX,tencent.com,DIRECT
- DOMAIN-SUFFIX,tencent-cloud.com,DIRECT
- GEOIP,CN,DIRECT
- DOMAIN-SUFFIX,ozon.ru,Bitz
