name: Clash Gemini Monitor Agent

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pyyaml

      - name: Install Clash Core on Runner
        run: |
          # 下载并配置轻量级 Clash 核心，供 Python 脚本在后台启动测试
          wget https://github.com/Dreamacro/clash/releases/download/v1.18.0/clash-linux-amd64-v1.18.0.gz
          gunzip clash-linux-amd64-v1.18.0.gz
          mv clash-linux-amd64-v1.18.0 /usr/local/bin/clash
          chmod +x /usr/local/bin/clash
          clash -v

      - name: Run Gemini Proxy Monitor Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python clash_monitor.py

      - name: Commit & Push Verified Subscription
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live_clash.yaml
          git commit -m "Auto update: Verified Gemini-accessible Clash nodes" || exit 0
          git push
