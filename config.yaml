sources:
  recent_days: 14
  min_stars: 30
  require_recent_push: true
  repositories_per_query: 20
  max_repositories: 80
  max_sources: 120
  max_candidate_files_per_repo: 6
  max_source_bytes: 8000000
  min_nodes_per_source: 2
  # 源头约束（2026-10-06 / 2026-10-20 / 2026-10-21 重聚焦）：
  #  - 主源 = GitHub 仓库搜索。原 query 用 clash/v2ray 等「客户端软件名」命中 284 个
  #    仓库全部是客户端软件（clash-verge/v2rayN/FlClash/Shadowrocket…），零真实订阅。
  #  - 2026-10-20 改为「节点提供方信号」(免费节点/机场订阅/clash订阅/proxy pool…)，
  #    并下调 min_stars 到 30——免费节点仓库星级普遍偏低，100 会把它们全过滤掉。
  #  - 2026-10-21 只读执行审计（Fine-clash-search-audit-12queries-2026-10-21.md）：
  #    12 条新查询共找到 4 个真实免费订阅源，但 **9 条（Q0/Q1/Q2/Q4/Q5/Q6/Q9/Q10/Q11）
  #    有效源数=0**，整体 precision≈3%。故删除该 9 条，仅保留产出全部 4 源的
  #    Q3(clash订阅)/Q7(v2ray free)/Q8(v2ray subscription)。
  #  - 高星客户端仓库稀释：审计 §1.2 确认 11 个客户端/面板仓库（clash-verge-rev、
  #    Hiddify、clashmi、clash-party、clashctl、Sub-Store、Shadowrocket 规则、
  #    v2rayNvpn、Free-AppleId-Serve、panda-vpn-pro 等）被星标排序全文搜索带回。
  #    这些非订阅源，由下方 exclude_repos（代码侧 post-search 过滤）剔除——不以内联
  #    `-repo:` 写进查询（GitHub 搜索 q 限长 256 字符，11 个排除会超限），也不靠猜测
  #    添加关键词或扩大搜索范围。
  #  - 候选文件再经 fine_clash._is_subscription_path 内容形态过滤（见模块常量）。
  #  - 排除付费订阅：direct_urls / curated_nodes_file 禁止填入任何付费机场。
  #  - 非 GIT 免费高质量订阅源可扩展进 direct_urls（须先验证稳定性，不填付费）。
  queries:
    - 'clash订阅 in:name,description,readme archived:false stars:>=20'
    - 'v2ray free in:name,description,readme archived:false stars:>=20'
    - 'v2ray subscription in:name,description,readme archived:false stars:>=20'
  # 审计 §1.2 确认的高星客户端/面板仓库（full_name），post-search 剔除，减少稀释。
  # 证据来源：Fine-clash-search-audit-12queries-2026-10-21.md §1.2。
  exclude_repos:
    - 'clash-verge-rev/clash-verge-rev'
    - 'hiddify/Hiddify-Manager'
    - 'hiddify/hiddify-app'
    - 'KaringX/clashmi'
    - 'mihomo-party-org/clash-party'
    - 'nelvko/clashctl'
    - 'sub-store-org/Sub-Store'
    - 'Johnshall/Shadowrocket-ADBlock-Rules-Forever'
    - 'githubvpn007/v2rayNvpn'
    - 'dongyubin/Free-AppleId-Serve'
    - 'DiningFactory/panda-vpn-pro'
# 非 GIT 免费高质量订阅源可在此扩展（验证稳定性后补充）；禁止付费机场。
direct_urls: []
# 手工筛选的稳定节点文件（免费源）；禁止付费。
curated_nodes_file: ''
nodes:
  allowed_types: [vmess, vless, trojan, ss]
  max_test_nodes: 200
  min_final_nodes: 3  # ★ F4 (2026-10-20): 抬高地板，杜绝“仅剩 1 节点仍覆盖发布”（原值 1 = 无质量保护）
  max_final_nodes: 20
  max_per_server: 2
  max_per_org: 3
  validation_workers: 8
  endpoint_workers: 6
  test_timeout_seconds: 8
  controller_startup_seconds: 1.5
  switch_wait_seconds: 0.5
  candidate_gate: 'gemini_or_play'
  score_threshold: 70
  min_clean_score: 65
  # 真实代理延迟硬门槛（2026-10-20）：real_proxy_ok 只证“能转发”，但 3.3s 的节点实质
  # 不可用。proxy_latency_ms 取 mihomo 实测 google204 握手延迟（探针超时 test_timeout_seconds=8s），
  # 超过此值的节点按配置明确拒绝（不得当 0ms 通过）。依据：559~592ms 的 NL 节点通过；
  # 3333ms 的 GB 节点与 5~8.5s 的 US 节点被拒。取值显著低于 8s 探针超时，故它是质量检测、
  # 不是探针假象；同时给正常高质量节点留足余量。
  max_proxy_latency_ms: 2500
  # 软优先级地板（2026-10-06 D 方向）：final 池截断时，低于此分的节点排到
  # 达地板节点之后，确保最终 20 个优先取高分优质节点。非硬门槛，0=不启用。
  min_final_score: 55
retention:
  enabled: true
  max_previous_nodes: 20
shenzhen_probe:
  enabled: true
  city: 'Shenzhen'
  protocol: 'TCP'
  packets: 4
  reject_above_ms: 350
  reject_loss_pct: 10
  cache_days: 1
  # workers 6->12（2026-10-06 C 方向）：提高探测并行度，减少 pending 积压，
  # 降低因 CI 时段内未测完导致的 not-tested/timeout 失真。
  workers: 12
  poll_interval_seconds: 1
  # max_wait_seconds 12->15：给 Globalping 探针更长时间，减少误判 timeout。
  max_wait_seconds: 15
  fail_closed: true
  api_token_env: 'GLOBALPING_API_TOKEN'
sticky:
  # 粘性优质节点：订阅更新时，若"当前连接节点"仍满足下方深圳质量门槛则保持为首选，
  # 仅当其退化（PING>=keep_ping_ms 或 掉包率>keep_loss_pct）才让位给池内新优质节点。
  # 实测 shenzhen_probe.packets=4 → 掉包粒度 0/25/50/75/100%，故 keep_loss_pct=5.0 即"零丢包才算优秀"。
  enabled: true
  keep_ping_ms: 300
  keep_loss_pct: 5.0
checks:
  gemini_url: 'https://gemini.google.com/'
  google_play_url: 'https://play.google.com/store'
  google_204_url: 'https://www.google.com/generate_204'
  ipinfo_url: 'https://ipinfo.io/json'
  success_statuses: [200, 204, 301, 302]
  challenge_markers:
    - 'unusual traffic'
    - 'our systems have detected unusual traffic'
    - 'captcha'
    - 'access denied'
output:
  clash_file: 'data/fine_pool.yaml'
  history_file: 'data/history.json'
  source_file: 'data/sources.json'
  source_history_file: 'data/source_history.json'
  report_file: 'data/last_run.json'
