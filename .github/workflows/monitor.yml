name: Clash Gemini Monitor Agent

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

concurrency:
  group: clash-gemini-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Install Mihomo
        run: |
          VERSION="v1.19.31"

          wget -q \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" \
            -O mihomo.gz

          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/clash

          clash -v

      - name: Run Monitor Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python clash_monitor.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add \
            live_clash.yaml \
            node_history.json \
            source_registry.json

          git diff --cached --quiet || \
            git commit -m "Auto update: Dynamic GitHub sources and verified Gemini nodes"

          git push
