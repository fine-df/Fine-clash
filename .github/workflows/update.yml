name: Fine-Clash update
# Push-triggered CI is intentional: production code changes must self-validate before publication.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.28

concurrency:
  # v2 unblocks the new bounded scanner from a pre-fix run stuck in the old concurrency group.
  group: fine-clash-update-v2
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Purge the CDN copy before rebuilding so stale cached profile content is removed early.
      - name: Purge public profile cache immediately
        run: |
          set -euo pipefail
          purge_url='https://purge.jsdelivr.net/gh/fine-df/Fine-clash@main/live_clash.yaml'
          curl -fsSL "$purge_url"
          echo

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Mihomo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_headers=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          version="${MIHOMO_VERSION}"
          asset="mihomo-linux-amd64-${version}.gz"
          curl -fsSL "${api_headers[@]}" "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
          curl -fsSL https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat -o geoip.dat
          test -s geoip.dat

      - name: Test code
        run: |
          pytest
          sh -n _fine_sync.sh

      - name: Build Fine pool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: |
          python fine_clash.py || { echo '--- mihomo logs (build failed) ---'; find /tmp -maxdepth 2 -name mihomo.log -exec echo "== {} ==" \; -exec cat {} \; ; exit 1; }

      - name: Build single public profile
        if: ${{ hashFiles('data/fine_pool.yaml') != '' }}
        # The public subscription is Fine-only; never pass paid-upstream secrets here.
        run: python build_final.py data/fine_pool.yaml

      - name: Validate profile
        if: ${{ hashFiles('data/fine_pool.yaml') != '' }}
        run: |
          set -euo pipefail
          test -s live_clash.yaml
          grep -q 'fine-clash-version:[0-9][0-9]*' live_clash.yaml
          grep -q '^mode: rule$' live_clash.yaml
          grep -q '^- name: Fine$' live_clash.yaml
          grep -q '^- name: Fine-Auto' live_clash.yaml
          grep -q '  - Fine-Auto' live_clash.yaml
          grep -q '  - DIRECT' live_clash.yaml
          if grep -Eq '^- name: GLOBAL' live_clash.yaml; then
            echo 'GLOBAL group must be absent (built-in to mihomo; a defined GLOBAL is redundant)'
            exit 1
          fi
          grep -q 'reject_above_ms: 250' config.yaml
          grep -q 'reject_loss_pct: 0' config.yaml
          grep -q 'cache_days: 0.25' config.yaml
          grep -q 'DOMAIN-SUFFIX,youtube.com,Fine' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,play.google.com,Fine' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,mi.com,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,wps.cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,wps.com,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,wps365.com,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,kdocs.cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,wpscdn.cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,wpscdn.com,DIRECT' live_clash.yaml
          grep -q 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve' live_clash.yaml
          grep -q 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve' live_clash.yaml
          grep -q 'GEOIP,CN,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,myqcloud.com,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,tencentcos.cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,mijia.com,DIRECT' live_clash.yaml
          grep -q 'default-selected' live_clash.yaml
          # The public profile has one supported layout: the validated Fine pool.
          grep -q 'MATCH,Fine' live_clash.yaml
          if grep -Eq '^[-[:space:]]*GEOSITE,' live_clash.yaml; then
            echo 'GEOSITE rule detected; refusing to validate a config that requires remote geodata.'
            exit 1
          fi
          if grep -Eq 'fine_final.yaml|fine-override:' live_clash.yaml; then
            echo 'obsolete router-specific markers detected'
            exit 1
          fi
          if grep -Eq '^proxy-providers:' live_clash.yaml; then
            echo 'proxy providers are not supported in the public profile'
            exit 1
          fi
          # Hard guard from the 2026-10-04 incident: a paid upstream credential must
          # never reach the publicly distributed profile.
          if grep -Eq 'token=' live_clash.yaml; then
            echo 'subscription credential or token-bearing URL leaked into public profile'
            exit 1
          fi
          python - <<'PY'
          import yaml
          with open('live_clash.yaml', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)
          groups = cfg.get('proxy-groups') or []
          if {g.get('name') for g in groups} != {'Fine', 'Fine-Auto'}:
              raise SystemExit('unsupported proxy group layout')
          if not groups or len(groups[0].get('proxies') or []) < 3:
              raise SystemExit('Fine group has no validated node members')
          if not groups[1].get('proxies'):
              raise SystemExit('Fine-Auto has no validated node members')
          if not cfg.get('rules') or cfg['rules'][-1] != 'MATCH,Fine':
              raise SystemExit('fallback must resolve to Fine')
          PY
          mihomo -t -f live_clash.yaml

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          # A run may have spent many minutes testing nodes. Never publish results
          # generated from an older checkout if main advanced while this job ran.
          git fetch --no-tags origin main
          checked_out_sha="$(git rev-parse HEAD)"
          latest_main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$checked_out_sha" != "$latest_main_sha" ]]; then
            echo "main advanced while this build was running; refusing stale publication."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A live_clash.yaml data/history.json data/sources.json data/last_run.json data/stable_pool.yaml data/known_good_fine_nodes.yaml
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'chore: publish Fine-only subscription'
          git push origin HEAD:main

      - name: Purge jsDelivr cache
        if: ${{ success() }}
        run: |
          set -euo pipefail
          purge_url='https://purge.jsdelivr.net/gh/fine-df/Fine-clash@main/live_clash.yaml'
          echo "Purging jsDelivr branch cache: ${purge_url}"
          curl -fsSL "${purge_url}"
          echo
