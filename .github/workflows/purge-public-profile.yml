name: Purge public subscription cache

on:
  push:
    branches:
      - main
    paths:
      - 'live_clash.yaml'
      - '.github/workflows/purge-public-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Purge and verify jsDelivr cached public profile
        run: |
          set -euo pipefail
          purge_url='https://purge.jsdelivr.net/gh/fine-df/Fine-clash@main/live_clash.yaml'
          for attempt in 1 2 3; do
            if ! response="$(curl -fsSL --max-time 20 "$purge_url")"; then
              echo "::warning::jsDelivr purge request failed (attempt $attempt/3)"
              sleep "$((attempt * 3))"
              continue
            fi
            printf '%s\n' "$response"
            if printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("paths") or {}; ok=(d.get("status")=="finished" and bool(p) and all(x.get("throttled") is False and isinstance(x.get("providers"),dict) and bool(x["providers"]) and all(v is True for v in x["providers"].values()) for x in p.values())); sys.exit(0 if ok else 1)'; then
              echo 'jsDelivr confirmed that cache providers purged the public profile'
              exit 0
            fi
            reset_seconds="$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("paths") or {}; print(max((int(x.get("throttlingReset",0) or 0) for x in p.values() if x.get("throttled")), default=0))')"
            if [[ "$reset_seconds" =~ ^[0-9]+$ ]] && (( reset_seconds > 0 )); then
              wait_seconds=$((reset_seconds + 3))
              if (( wait_seconds >= 1800 )); then
                echo "::error::jsDelivr throttle reset (${wait_seconds}s) exceeds the configured purge window"
                exit 1
              fi
              echo "::warning::jsDelivr is throttling purge requests; waiting ${wait_seconds}s before retry"
              sleep "$wait_seconds"
            else
              echo "::warning::jsDelivr did not confirm a full purge (attempt $attempt/3)"
              sleep "$((attempt * 3))"
            fi
          done
          echo "::error::jsDelivr cache purge did not confirm success; the CDN may still serve stale profile content"
          exit 1
