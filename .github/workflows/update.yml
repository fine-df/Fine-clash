name: Fine-Clash daily update

on:
  schedule:
    # 每 4 小时一次（UTC）。节点寿命以小时计，刷得太少 = 死节点长期滞留池子。
    # 曾因 schedule 停在 '0 2 * * *'（1 次/天）导致 9 个后死节点霸占池子。
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fine-clash-daily
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest Mihomo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_headers=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          version=$(curl -fsSL "${api_headers[@]}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          asset="mihomo-linux-amd64-${version}.gz"
          curl -fsSL "${api_headers[@]}" "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
      - name: Test code
        run: pytest
      - name: Discover, test, score and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python fine_clash.py
      - name: Build router profile (fine_final.yaml)
        run: |
          set -euo pipefail
          python build_final.py live_clash.yaml
      - name: Validate generated Clash config
        run: |
          set -euo pipefail
          mihomo -t -f live_clash.yaml
          mihomo -t -f fine_final.yaml
      - name: Fetch public filler pool (extra_pool.yaml) for Fine group
        run: |
          set -euo pipefail
          # clashfree 大池（400+ 节点）。Bitz 组用其中 20 个，
          # 剩下的给 Fine 组做公开兜底（专线是用户私有机场节点，公开源里 0 个，
          # 全烂时有兜底才不会断）。取最新一个 yml 的 proxies 段。
          pick() {
            for p in clash20261001.yml clash20261003.yml clash20261002.yml; do
              if curl -fsSL --compressed --max-time 90 "https://raw.githubusercontent.com/free-nodes/clashfree/main/$p" -o pool.yml; then
                python - "$p" <<'PY'
                import re, sys
                t = open("pool.yml", encoding="utf-8", errors="replace").read()
                i = t.find("proxies:")
                if i < 0:
                  raise SystemExit(1)
                j = t.find("\nproxy-groups:", i)
                seg = t[i:j if j > 0 else len(t)]
                n = len(re.findall(r"^\s+-\s*\{?name[=:]", seg, re.M))
                print("pool=%s nodes=%d" % (sys.argv[1], n))
                if n < 50:
                  raise SystemExit(1)
                open("extra_pool.yaml", "w", encoding="utf-8", newline="").write(seg)
                PY
                return 0
              fi
            done
            echo "warning: no public filler pool fetched; Fine group falls back to line nodes only"
            exit 0
          }
          pick
      - name: Rebuild universal phone/PC profile (mobile_dual_uni.yaml)
        run: python build_uni.py
      - name: Validate universal profile
        run: |
          set -euo pipefail
          mihomo -t -f mobile_dual_uni.yaml
      - name: Commit outputs and history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add data
            if [ -f live_clash.yaml ]; then git add live_clash.yaml; fi
            if [ -f fine_final.yaml ]; then git add fine_final.yaml; fi
            if [ -f live_v2ray.txt ]; then git add live_v2ray.txt; fi
            if [ -f mobile_dual_uni.yaml ]; then git add mobile_dual_uni.yaml; fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'chore: update verified subscriptions'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Failed to publish after 3 attempts'
          exit 1

      # GitHub 会对长时间无活动的仓库冻结 schedule，
      # 这里做兜底：距上次成功超过 22 小时就自己再触发一次。
      - name: Self-trigger watchdog
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, time, urllib.request
          from datetime import datetime, timezone
          token = os.environ["GH_TOKEN"]
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/")

          def api(path, method="GET", data=None):
              url = "https://api.github.com/repos/%s/%s%s" % (owner, repo, path)
              req = urllib.request.Request(url, method=method, data=data)
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("User-Agent", "fine-clash-watchdog")
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)

          runs = api("/actions/runs?status=success&per_page=1&branch=main")
          wr = runs.get("workflow_runs") or []
          gap = 999.0
          if wr:
              # API v3 的 created_at 是 ISO 字符串，必须转 datetime 才能相减
              t0 = datetime.fromisoformat(wr[0]["created_at"].replace("Z", "+00:00"))
              gap = (datetime.now(timezone.utc) - t0).total_seconds() / 3600.0
          print("last_success=%s gap_hours=%.1f" % (wr[0]["created_at"] if wr else "none", gap))
          if gap < 22:
              print("watchdog skip: too fresh")
              raise SystemExit(0)
          print("watchdog trigger: dispatch update.yml")
          api("/actions/workflows/update.yml/dispatches", method="POST",
              data=json.dumps({"ref": "main"}).encode())
          PY
