name: Fine-Clash update

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fine-clash-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download Mihomo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_headers=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          version=$(curl -fsSL "${api_headers[@]}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          asset="mihomo-linux-amd64-${version}.gz"
          curl -fsSL "${api_headers[@]}" "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
          # Download GeoIP data explicitly; CI must not depend on Mihomo runtime downloads.
          curl -fsSL https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat -o geoip.dat
          test -s geoip.dat
      - name: Test code
        run: pytest
      - name: Build Fine pool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python fine_clash.py
      - name: Build single public profile
        run: python build_final.py data/fine_pool.yaml
      - name: Validate profile
        run: |
          set -euo pipefail
          test -s live_clash.yaml
          grep -q '^proxy-providers:' live_clash.yaml
          grep -q '^  BitzPool:' live_clash.yaml
          grep -q '^  - name: Bitz' live_clash.yaml
          grep -q '^  - name: Fine' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,ozon.ru,Bitz' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,amazon.com,Bitz' live_clash.yaml
          grep -q 'MATCH,Fine' live_clash.yaml
          grep -q 'GEOIP,CN,DIRECT' live_clash.yaml
          # CI must never depend on remote GeoSite downloads. build_final.py is intentionally GEOIP-only.
          if grep -Eq '^[-[:space:]]*GEOSITE,' live_clash.yaml; then
            echo 'GEOSITE rule detected; refusing to validate a config that requires remote geodata.'
            exit 1
          fi
          if grep -Eq 'fine_final.yaml|fine-override:' live_clash.yaml; then
            echo 'obsolete router-specific markers detected'
            exit 1
          fi
          mihomo -t -f live_clash.yaml
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_clash.yaml data/history.json data/sources.json data/last_run.json
          git add -u fine_final.yaml fine_merged.yaml live_v2ray.txt live_probes.json || true
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'chore: publish unified Fine/Bitz subscription'
          git push origin HEAD:main
