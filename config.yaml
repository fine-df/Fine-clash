sources:
  recent_days: 14
  min_stars: 100
  require_recent_push: true
  repositories_per_query: 20
  max_repositories: 80
  max_sources: 120
  max_candidate_files_per_repo: 6
  max_source_bytes: 8000000
  min_nodes_per_source: 2
  # 源头约束（2026-10-06）：
  #  - 主源 = GitHub 高星高质量仓库搜索（stars>=100 兜底质量，require_recent_push 保活跃）。
  #  - 专项加强美国非机房（residential/ISP）节点：下方 US/American/USA/residential 类查询。
  #  - 排除付费订阅：direct_urls / curated_nodes_file 禁止填入任何付费机场。
  #  - 非 GIT 免费高质量订阅源可扩展进 direct_urls（须先验证稳定性，不填付费）。
  queries:
    - 'clash subscription in:name,description,readme archived:false stars:>=100'
    - 'clash config in:name,description,readme archived:false stars:>=100'
    - 'v2ray subscription in:name,description,readme archived:false stars:>=100'
    - 'v2ray config in:name,description,readme archived:false stars:>=100'
    - 'proxy subscription in:name,description,readme archived:false stars:>=100'
    - '节点订阅 in:name,description,readme archived:false stars:>=100'
    - '机场 in:name,description,readme archived:false stars:>=100'
    - 'topic:clash archived:false stars:>=100'
    - 'topic:v2ray archived:false stars:>=100'
    - 'topic:proxy archived:false stars:>=100'
    - 'US proxy in:name,description,readme archived:false stars:>=50'
    - 'USA v2ray nodes in:name,description,readme archived:false stars:>=50'
    - 'American residential proxy in:name,description,readme archived:false stars:>=50'
    - 'United States proxy nodes in:name,description,readme archived:false stars:>=50'
    - 'residential proxy in:name,description,readme archived:false stars:>=50'
# 非 GIT 免费高质量订阅源可在此扩展（验证稳定性后补充）；禁止付费机场。
direct_urls: []
# 手工筛选的稳定节点文件（免费源）；禁止付费。
curated_nodes_file: ''
nodes:
  allowed_types: [vmess, vless, trojan, ss]
  max_test_nodes: 200
  min_final_nodes: 3  # ★ F4 (2026-10-20): 抬高地板，杜绝“仅剩 1 节点仍覆盖发布”（原值 1 = 无质量保护）
  max_final_nodes: 20
  max_per_server: 2
  max_per_org: 3
  validation_workers: 8
  endpoint_workers: 6
  test_timeout_seconds: 8
  controller_startup_seconds: 1.5
  switch_wait_seconds: 0.5
  candidate_gate: 'gemini_or_play'
  score_threshold: 70
  min_clean_score: 65
  # 真实代理延迟硬门槛（2026-10-20）：real_proxy_ok 只证“能转发”，但 3.3s 的节点实质
  # 不可用。proxy_latency_ms 取 mihomo 实测 google204 握手延迟（探针超时 test_timeout_seconds=8s），
  # 超过此值的节点按配置明确拒绝（不得当 0ms 通过）。依据：559~592ms 的 NL 节点通过；
  # 3333ms 的 GB 节点与 5~8.5s 的 US 节点被拒。取值显著低于 8s 探针超时，故它是质量检测、
  # 不是探针假象；同时给正常高质量节点留足余量。
  max_proxy_latency_ms: 2500
  # 软优先级地板（2026-10-06 D 方向）：final 池截断时，低于此分的节点排到
  # 达地板节点之后，确保最终 20 个优先取高分优质节点。非硬门槛，0=不启用。
  min_final_score: 55
retention:
  enabled: true
  max_previous_nodes: 20
shenzhen_probe:
  enabled: true
  city: 'Shenzhen'
  protocol: 'TCP'
  packets: 4
  reject_above_ms: 350
  reject_loss_pct: 10
  cache_days: 1
  # workers 6->12（2026-10-06 C 方向）：提高探测并行度，减少 pending 积压，
  # 降低因 CI 时段内未测完导致的 not-tested/timeout 失真。
  workers: 12
  poll_interval_seconds: 1
  # max_wait_seconds 12->15：给 Globalping 探针更长时间，减少误判 timeout。
  max_wait_seconds: 15
  fail_closed: true
  api_token_env: 'GLOBALPING_API_TOKEN'
sticky:
  # 粘性优质节点：订阅更新时，若"当前连接节点"仍满足下方深圳质量门槛则保持为首选，
  # 仅当其退化（PING>=keep_ping_ms 或 掉包率>keep_loss_pct）才让位给池内新优质节点。
  # 实测 shenzhen_probe.packets=4 → 掉包粒度 0/25/50/75/100%，故 keep_loss_pct=5.0 即"零丢包才算优秀"。
  enabled: true
  keep_ping_ms: 300
  keep_loss_pct: 5.0
checks:
  gemini_url: 'https://gemini.google.com/'
  google_play_url: 'https://play.google.com/store'
  google_204_url: 'https://www.google.com/generate_204'
  ipinfo_url: 'https://ipinfo.io/json'
  success_statuses: [200, 204, 301, 302]
  challenge_markers:
    - 'unusual traffic'
    - 'our systems have detected unusual traffic'
    - 'captcha'
    - 'access denied'
output:
  clash_file: 'data/fine_pool.yaml'
  history_file: 'data/history.json'
  source_file: 'data/sources.json'
  source_history_file: 'data/source_history.json'
  report_file: 'data/last_run.json'
