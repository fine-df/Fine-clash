name: Purge public subscription cache

on:
  push:
    branches:
      - main
    paths:
      - 'live_clash.yaml'
      - '.github/workflows/purge-public-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Purge and verify jsDelivr cached public profile
        run: |
          set -euo pipefail
          purge_url='https://purge.jsdelivr.net/gh/fine-df/Fine-clash@main/live_clash.yaml'
          for attempt in 1 2 3; do
            if ! response="$(curl -fsSL --max-time 20 "$purge_url")"; then
              echo "::warning::jsDelivr purge request failed (attempt $attempt/3)"
              sleep "$((attempt * 3))"
              continue
            fi
            printf '%s\n' "$response"
            if printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("paths") or {}; ok=(d.get("status")=="finished" and bool(p) and all(x.get("throttled") is False and isinstance(x.get("providers"),dict) and bool(x["providers"]) and all(v is True for v in x["providers"].values()) for x in p.values())); sys.exit(0 if ok else 1)'; then
              echo 'jsDelivr purge API confirmed that all reported cache providers completed'
              verify_dir="$(mktemp -d)"
              trap 'rm -rf "$verify_dir"' EXIT
              origin_url='https://raw.githubusercontent.com/fine-df/Fine-clash/main/live_clash.yaml'
              cdn_url='https://cdn.jsdelivr.net/gh/fine-df/Fine-clash@main/live_clash.yaml'
              curl -fsSL --max-time 20 "$origin_url" -o "$verify_dir/origin.yaml"
              expected_version="$(sed -n '1s/.*fine-clash-version:\\([0-9][0-9]*\\).*/\\1/p' "$verify_dir/origin.yaml")"
              if [[ ! "$expected_version" =~ ^[0-9]+$ ]]; then
                echo '::error::GitHub origin profile has no valid version marker'
                exit 1
              fi
              for verify_attempt in 1 2 3; do
                if curl -fsSL --max-time 20 "$cdn_url" -o "$verify_dir/cdn.yaml" && cmp -s "$verify_dir/origin.yaml" "$verify_dir/cdn.yaml"; then
                  echo "jsDelivr content verified: exact byte match, version $expected_version"
                  exit 0
                fi
                actual_version="$(sed -n '1s/.*fine-clash-version:\\([0-9][0-9]*\\).*/\\1/p' "$verify_dir/cdn.yaml" 2>/dev/null || true)"
                echo "::warning::CDN content mismatch (attempt $verify_attempt/3; expected version $expected_version, received ${actual_version:-missing})"
                sleep "$((verify_attempt * 3))"
              done
              echo '::error::CDN purge response succeeded but served content still differs from GitHub origin'
              exit 1
            fi
            reset_seconds="$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("paths") or {}; print(max((int(x.get("throttlingReset",0) or 0) for x in p.values() if x.get("throttled")), default=0))')"
            if [[ "$reset_seconds" =~ ^[0-9]+$ ]] && (( reset_seconds > 0 )); then
              wait_seconds=$((reset_seconds + 3))
              if (( wait_seconds >= 1800 )); then
                echo "::error::jsDelivr throttle reset (${wait_seconds}s) exceeds the configured purge window"
                exit 1
              fi
              echo "::warning::jsDelivr is throttling purge requests; waiting ${wait_seconds}s before retry"
              sleep "$wait_seconds"
            else
              echo "::warning::jsDelivr did not confirm a full purge (attempt $attempt/3)"
              sleep "$((attempt * 3))"
            fi
          done
          echo "::error::jsDelivr cache purge did not confirm success; the CDN may still serve stale profile content"
          exit 1
