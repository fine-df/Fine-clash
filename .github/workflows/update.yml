name: Fine-Clash update
# The published `live_clash.yaml` is consumed by four clients INSIDE China.
# The profile is a self-contained flat `proxies:` list aggregated from live free
# sources, so it parses on every client (Shadowrocket / mihomo / ShellCrash /
# Clash Verge) and never depends on proxy-providers (which the router validator
# and Shadowrocket reject). Freshness comes from rebuilding on a schedule, not
# from a fragile China-network publish gate. The previous failure mode (a frozen
# pool because the US runner could not satisfy the China gate) is gone.
#
# Cadence: every push/dispatch rebuilds; a scheduled run every 3h keeps the
# embedded node snapshot fresh so free nodes that die are replaced promptly.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.28

concurrency:
  group: fine-clash-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Mihomo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_headers=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          version="${MIHOMO_VERSION}"
          asset="mihomo-linux-amd64-${version}.gz"
          curl -fsSL "${api_headers[@]}" "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
          curl -fsSL https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat -o geoip.dat
          test -s geoip.dat

      - name: Test code
        run: |
          pytest
          sh -n _fine_sync.sh

      - name: Build single public profile (live free sources)
        if: ${{ !startsWith(github.event.head_commit.message || '', 'routing-only:') }}
        run: python build_final.py

      - name: Validate profile
        if: ${{ !startsWith(github.event.head_commit.message || '', 'routing-only:') }}
        run: |
          set -euo pipefail
          test -s live_clash.yaml
          grep -q 'fine-clash-version:[0-9][0-9]*' live_clash.yaml
          grep -q '^mode: rule$' live_clash.yaml
          grep -q '^- name: Fine' live_clash.yaml
          grep -q '^- name: AUTO' live_clash.yaml
          grep -q '  - AUTO' live_clash.yaml
          grep -q '  - DIRECT' live_clash.yaml
          grep -q 'default-selected' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,youtube.com,Fine' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,play.google.com,Fine' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,mi.com,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,myqcloud.com,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,tencentcos.cn,DIRECT' live_clash.yaml
          grep -q 'DOMAIN-SUFFIX,mijia.com,DIRECT' live_clash.yaml
          grep -q 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve' live_clash.yaml
          grep -q 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve' live_clash.yaml
          grep -q 'GEOIP,CN,DIRECT' live_clash.yaml
          grep -q 'MATCH,Fine' live_clash.yaml
          if grep -Eq '^[-[:space:]]*GEOSITE,' live_clash.yaml; then
            echo 'GEOSITE rule detected; refusing to validate a config that requires remote geodata.'
            exit 1
          fi
          if grep -Eq 'fine_final.yaml|fine-override:' live_clash.yaml; then
            echo 'obsolete router-specific markers detected'
            exit 1
          fi
          if grep -Eq 'cont\\.bbkcdpub\\.com|token=' live_clash.yaml; then
            echo 'subscription credential or token-bearing URL leaked into public profile'
            exit 1
          fi
          mihomo -t -f live_clash.yaml

      - name: Validate routing-only profile without rebuilding nodes
        if: ${{ startsWith(github.event.head_commit.message || '', 'routing-only:') }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("live_clash.yaml")
          assert path.is_file() and path.stat().st_size > 0, "live profile missing or empty"
          cfg = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert cfg.get("mode") == "rule", "unexpected routing mode"

          groups = {group["name"]: group for group in cfg.get("proxy-groups", [])}
          assert set(groups) == {"Fine", "AUTO"}, f"unexpected group set: {set(groups)}"
          assert groups["Fine"]["type"] == "select"
          assert groups["Fine"]["proxies"][:2] == ["AUTO", "DIRECT"]
          assert groups["AUTO"]["type"] == "url-test" and groups["AUTO"].get("hidden") is True

          rules = cfg.get("rules", [])
          geoip_cn = rules.index("GEOIP,CN,DIRECT")
          assert rules[-1] == "MATCH,Fine"
          for domain in ("ozon.ru", "ozon.com", "ozonusercontent.com", "ozoncdn.ru", "ozoncdn.com", "o3.ru", "ozone.ru", "ozonpartners.ru", "ozon.tech", "ozon.by", "ozon.kz"):
              rule = f"DOMAIN-SUFFIX,{domain},Fine"
              assert rule in rules and rules.index(rule) < geoip_cn, f"missing or misplaced Ozon route: {rule}"
          for domain in ("wps.cn", "wps.com", "kdocs.cn", "kdocs.com", "kingsoft.com", "mi.com", "xiaomi.com", "miwifi.com", "miui.com", "mijia.com", "xiaomi.cn", "weixin.qq.com", "wx.qq.com", "wechat.com", "qq.com"):
              rule = f"DOMAIN-SUFFIX,{domain},DIRECT"
              assert rule in rules and rules.index(rule) < geoip_cn, f"missing or misplaced direct route: {rule}"
          assert "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve" in rules
          assert not any(rule.startswith("DOMAIN-SUFFIX,ozon.ru,DIRECT") for rule in rules)
          print(f"Routing-only profile passed structural audit: {len(cfg.get('proxies', []))} nodes, {len(rules)} rules.")
          PY
          mihomo -t -f live_clash.yaml

      - name: Publish
        if: github.ref == 'refs/heads/main' && (github.actor != 'github-actions[bot]' || github.event_name == 'schedule') && !startsWith(github.event.head_commit.message || '', 'routing-only:')
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_clash.yaml
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'chore: publish Fine-only subscription'
          git push origin HEAD:main

      - name: Purge jsDelivr cache
        if: ${{ success() }}
        run: |
          set -euo pipefail
          purge_url='https://purge.jsdelivr.net/gh/fine-df/Fine-clash@main/live_clash.yaml'
          echo "Purging jsDelivr branch cache: ${purge_url}"
          curl -fsSL "${purge_url}"
          echo
