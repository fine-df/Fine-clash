name: Provider group compatibility audit

on:
  push:
    branches:
      - feat/global-manual-mode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        mihomo_version: [v1.19.28, v1.19.31]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Mihomo
        env:
          MIHOMO_VERSION: ${{ matrix.mihomo_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api_headers=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          asset="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          curl -fsSL "${api_headers[@]}" "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${asset}" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Run provider group smoke test
        run: |
          set -euo pipefail
          python tools/provider_group_smoke.py --binary "$PWD/mihomo"
