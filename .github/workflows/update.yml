name: Fine-Clash daily update

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fine-clash-daily
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          asset="mihomo-linux-amd64-${version}.gz"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${version}/${asset}" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v
      - name: Test code
        run: pytest
      - name: Discover, test, score and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLOBALPING_API_TOKEN: ${{ secrets.GLOBALPING_API_TOKEN }}
        run: python fine_clash.py
      - name: Validate generated Clash config
        run: |
          set -euo pipefail
          if [ -f live_clash.yaml ]; then
            mihomo -t -f live_clash.yaml
          else
            echo "No live_clash.yaml published in this run"
          fi
      - name: Commit outputs and history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add data
            if [ -f live_clash.yaml ]; then git add live_clash.yaml; fi
            if [ -f live_v2ray.txt ]; then git add live_v2ray.txt; fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'chore: update verified subscriptions'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Failed to publish after 3 attempts'
          exit 1
