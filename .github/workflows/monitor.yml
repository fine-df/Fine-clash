name: Clash Gemini Monitor Agent

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - clash_monitor.py
      - .github/workflows/monitor.yml
      - requirements.txt

concurrency:
  group: clash-gemini-monitor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Mihomo
        run: |
          VERSION="v1.19.31"

          wget -q \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" \
            -O mihomo.gz

          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/clash

          clash -v

      - name: Run Monitor Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python clash_monitor.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # The monitor generates a local commit while another change may land on main.
          # Rebase can conflict on generated files, so preserve the generated worktree,
          # move HEAD to the latest remote main, then create a fresh output commit.
          git add \
            live_clash.yaml \
            live_v2ray.txt \
            node_history.json \
            subscription_sources.json \
            source_registry.json

          git diff --cached --quiet || \
            git commit -m "Auto update: verified Clash and V2Ray subscriptions"

          git fetch origin main
          git reset --soft origin/main

          git add \
            live_clash.yaml \
            live_v2ray.txt \
            node_history.json \
            subscription_sources.json \
            source_registry.json

          git diff --cached --quiet || \
            git commit -m "Auto update: verified Clash and V2Ray subscriptions"

          git push origin HEAD:main
